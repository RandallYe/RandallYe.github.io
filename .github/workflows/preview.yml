name: Validate and package preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate root and project-path output
        run: npm run verify
      - name: Package the verified root build
        uses: actions/upload-artifact@v7
        with:
          name: research-homepage-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
